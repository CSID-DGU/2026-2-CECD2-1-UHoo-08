spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 AI/db/migrations 의 SQL로만 바꾼다
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB      # StorageService 상한과 같게. 기본값 1MB 면 그보다 큰 사진이 서비스까지 오지 못한다
      max-request-size: 11MB

  task:
    scheduling:
      pool:
        size: 3                # 기본값 1 이면 배치 하나가 길어질 때 다른 배치가 밀린다
      thread-name-prefix: hwadam-batch-

  jackson:
    naming-strategy: com.fasterxml.jackson.databind.PropertyNamingStrategies$LowerCamelCaseStrategy
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-minimum-32chars}
  access-expiry-ms: 3600000
  refresh-expiry-ms: 2592000000

# 화담 서비스 설정 (common/config/HwadamProperties).
hwadam:
  zone: Asia/Seoul             # 서비스가 "오늘"을 정하는 시간대. 배치 cron 시간대와 따로 둔다
  batch:
    zone: Asia/Seoul           # cron 해석 시간대. 서버는 UTC 로 돈다
    photo-recognition-cleanup-cron: "0 0 * * * *"   # 만료된 사진 인식 결과 정리, 매시 정각
    stuck-job-cleanup-cron: "0 */10 * * * *"         # 멈춘 추천 job 정리, 10분마다
    stuck-job-timeout: 15m                           # 대기·진행 중인 job 이 이만큼 갱신되지 않으면 실패
    clarification-timeout: 24h                       # 되묻는 중인 job 이 이만큼 답을 못 받으면 실패
    home-cron: "0 30 6 * * *"                        # 홈 카드 생성 요청, 매일 06:30
    home-calls-per-second: 2                         # 홈 카드 생성을 AI 에 요청하는 초당 횟수
    home-include-synthetic: false                    # 합성 사용자의 홈 카드도 만들지
  env:
    uv-high: 6              # 최고 자외선 지수가 이 값 이상이면 자외선 높은 날
    pm10-bad: 80            # PM10 평균이 이 값을 넘으면 미세먼지 나쁜 날
    pm25-bad: 35            # PM2.5 평균이 이 값을 넘으면 미세먼지 나쁜 날
    humidity-low: 40        # 습도 평균이 이 값보다 낮으면 건조한 날
    humidity-change: 15     # 최근 7일과 3주 전 7일의 평균 습도가 이만큼(%p) 다르면 계절 전환
  admin:
    user-ids: ${HWADAM_ADMIN_USER_IDS:}   # 관리자 사용자 ID, 쉼표로 구분. 비어 있으면 아무도 부를 수 없다

ai:
  server-url: ${AI_SERVER_URL}   # FastAPI 주소

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI}

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  shop-search-url: https://openapi.naver.com/v1/search/shop.json

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  storage-url: ${SUPABASE_URL}/storage/v1/object

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha