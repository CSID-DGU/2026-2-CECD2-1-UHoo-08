spring:
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 AI/db/migrations 의 SQL로만 바꾼다
    properties:
      hibernate:
        format_sql: true
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB      # StorageService 상한과 같게. 기본값 1MB 면 그보다 큰 사진이 서비스까지 오지 못한다
      max-request-size: 11MB

  task:
    scheduling:
      pool:
        size: 3                # 기본값 1 이면 배치 하나가 길어질 때 다른 배치가 밀린다
      thread-name-prefix: hwadam-batch-

  jackson:
    naming-strategy: com.fasterxml.jackson.databind.PropertyNamingStrategies$LowerCamelCaseStrategy
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-minimum-32chars}
  access-expiry-ms: 3600000
  refresh-expiry-ms: 2592000000

# 화담 서비스 설정 (common/config/HwadamProperties).
hwadam:
  batch:
    zone: Asia/Seoul           # cron 해석 시간대. 서버는 UTC 로 돈다
    photo-recognition-cleanup-cron: "0 0 * * * *"   # 만료된 사진 인식 결과 정리, 매시 정각

ai:
  server-url: ${AI_SERVER_URL}   # FastAPI 주소

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI}

naver:
  client-id: ${NAVER_CLIENT_ID}
  client-secret: ${NAVER_CLIENT_SECRET}
  shop-search-url: https://openapi.naver.com/v1/search/shop.json

supabase:
  url: ${SUPABASE_URL}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}
  storage-url: ${SUPABASE_URL}/storage/v1/object

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha