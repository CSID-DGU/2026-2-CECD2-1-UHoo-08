name: BE 테스트

# BE 단위 테스트와 AI 계약 테스트(AiContractTest)를 돌린다. 공유 DB 접속 정보는
# 넣지 않는다. 팀원 PR 의 테스트가 공유 DB 에 붙으면 안 되기 때문이다. DB 가 필요한
# contextLoads 는 SPRING_DATASOURCE_URL 이 없으면 건너뛴다.
#
# AI 계약만 바꾼 PR 은 AI 코어 테스트가 예시 JSON 수정을 요구하고, 예시 JSON 이
# 바뀌면 여기서 BE DTO 와 비교한다. 그래서 실행 조건에 AI/** 는 넣지 않는다.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'BE/**'
      - 'docs/internal-api-fixtures/**'
      - '.github/workflows/be-tests.yml'
  push:
    branches: [main, develop]
    paths:
      - 'BE/**'
      - 'docs/internal-api-fixtures/**'
      - '.github/workflows/be-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: BE 테스트
        run: ./gradlew test --no-daemon

      - name: 실패한 테스트 리포트 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: be-test-report
          path: BE/build/reports/tests/test
